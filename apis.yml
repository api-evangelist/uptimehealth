aid: uptimehealth
name: UptimeHealth
description: UptimeHealth is a healthcare operations platform for managing medical
  equipment service, compliance documentation, and facility maintenance across dental,
  medical, and veterinary practices from a single dashboard. The platform tracks devices,
  automates compliance tasks and logs, and coordinates repair service requests, reporting
  73,000+ devices protected across 6,000+ facilities. UptimeHealth publishes no public
  developer API, SDKs, or API documentation — its platform (uptimecontroller.com)
  is a closed SaaS application.
